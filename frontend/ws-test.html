<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Test</title>
</head>
<body>

<h1>Packet Sniffer WebSocket Test</h1>

<pre id="output"></pre>

<script>
  const output = document.getElementById("output");

  const ws = new WebSocket("ws://localhost:8080/ws");

  ws.onopen = () => {
    console.log("CONNECTED");
    output.textContent += "CONNECTED\n";
  };

  ws.onmessage = (event) => {
    console.log(event.data);

    output.textContent += event.data + "\n\n";
  };

  ws.onerror = (err) => {
    console.error(err);
  };

  ws.onclose = () => {
    console.log("DISCONNECTED");
  };
</script>

</body>
</html>

<button onclick="startCapture(4)">Start Capture (ID 4)</button>
<button onclick="startCapture(4)">Start Capture (ID r)</button>

<script>
function startCapture(id) {
  fetch(`http://localhost:8080/capture/start/${id}`, {
    method: "POST"
  })
  .then(res => res.text())
  .then(data => {
    console.log("Started:", data);
  })
  .catch(console.error);
}
</script>
