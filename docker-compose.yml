services:
  backend:
    build: ./backend
    container_name: packetsniffer-backend
    ports:
      - "8080:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    container_name: packetsniffer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
